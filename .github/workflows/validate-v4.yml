name: Validate PackVerse v0.12

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Legacy regression checks
        run: node scripts/validate-v4.mjs
      - name: AI smoke — packs, Club, XI, Draft Cup, SBC, assets and cards
        run: node scripts/smoke-v12.mjs
