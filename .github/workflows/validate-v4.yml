name: Validate PackVerse v0.17 Asset Persistence

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Legacy regression checks
        run: node scripts/validate-v4.mjs
      - name: V0.12 systems regression smoke
        run: node scripts/smoke-v12.mjs
      - name: V0.13 canonical card audit — all seven rarities
        run: node scripts/smoke-v13.mjs
      - name: V0.14 player integrity + pool audit
        run: node scripts/smoke-v14.mjs
      - name: V0.15 visual asset audit
        run: node scripts/smoke-v15.mjs
      - name: V0.16 current-shirt + IF/base asset audit
        run: node scripts/smoke-v16.mjs
      - name: V0.17 persistence + lazy hydration audit
        run: node scripts/smoke-v17.mjs
      - name: V0.14 machine-readable asset coverage report
        run: node scripts/report-assets-v14.mjs
      - name: V0.16 current visual coverage report
        run: node scripts/report-assets-v16.mjs
      - name: V0.17 deterministic identity coverage report
        run: node scripts/report-assets-v17.mjs
      - name: Chromium smoke — mobile + desktop Companion + Draft field
        run: node scripts/browser-smoke-v12.mjs
      - name: Chromium card matrix — all seven rarities
        run: node scripts/browser-card-matrix-v13.mjs
      - name: Chromium V0.16 visual audit — current shirt + identity slots + IF reuse
        run: node scripts/browser-visual-audit-v16.mjs
      - name: Chromium V0.17 — reload persistence + deterministic crests
        run: node scripts/browser-assets-v17.mjs
      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packverse-browser-smoke
          path: .smoke-artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
